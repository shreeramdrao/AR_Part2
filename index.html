<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8thWall WebAR</title>

    <script src="https://cdn.8thwall.com/web/8frame/8frame.js"></script>

    <style>
        body { margin: 0; overflow: hidden; }
        #startAR {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            font-size: 18px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            z-index: 100;
        }
    </style>
</head>
<body>

    <button id="startAR">Start AR</button>

    <a-scene embedded arjs vr-mode-ui="enabled: false">
        <a-light type="directional" intensity="0.8" position="1 1 1"></a-light>
        <a-camera position="0 1.6 0"></a-camera>
        <a-entity id="ar-model" position="0 0 -3">
            <a-gltf-model src="https://ar-part2.vercel.app/assets/food.glb"></a-gltf-model>
        </a-entity>
    </a-scene>

    <script>
        document.getElementById("startAR").addEventListener("click", () => {
            document.querySelector("a-scene").setAttribute("arjs", "sourceType: webcam; debugUIEnabled: false;");
            document.getElementById("startAR").style.display = "none";
        });
    </script>

</body>
</html>
