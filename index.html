<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR AR Experience</title>

    <!-- Load Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Load GLTFLoader separately -->
    <script src="https://cdn.jsdelivr.net/npm/three/examples/js/loaders/GLTFLoader.js"></script>

    <style>
        body { margin: 0; overflow: hidden; }
        #startAR {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            font-size: 18px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            z-index: 100;
        }
    </style>
</head>
<body>

<button id="startAR">Start AR</button>

<script>
    let scene, camera, renderer, model, xrSession, xrRefSpace;
    let loader = new THREE.GLTFLoader(); // Properly define the loader

    document.getElementById("startAR").addEventListener("click", async () => {
        if (navigator.xr) {
            try {
                xrSession = await navigator.xr.requestSession("immersive-ar", { requiredFeatures: ["local-floor"] });
                xrSession.addEventListener("end", () => console.log("AR session ended"));

                // WebGL Renderer
                renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.xr.enabled = true;
                document.body.appendChild(renderer.domElement);

                // Setup Scene & Camera
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
                scene.add(camera);

                // Lighting
                const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
                scene.add(light);

                // Load Model
                loader.load("https://ar-part2.vercel.app/assets/food.glb", function (gltf) {
                    model = gltf.scene;
                    model.scale.set(1, 1, 1);
                    model.position.set(0, -1, -3);
                    scene.add(model);
                });

                // Set Reference Space
                xrRefSpace = await xrSession.requestReferenceSpace("local-floor");

                function render(timestamp, frame) {
                    const pose = frame.getViewerPose(xrRefSpace);
                    if (pose) {
                        const pos = pose.transform.position;
                        model.position.set(pos.x, pos.y - 1.5, pos.z - 2);
                    }
                    renderer.render(scene, camera);
                    xrSession.requestAnimationFrame(render);
                }

                xrSession.requestAnimationFrame(render);
                document.getElementById("startAR").style.display = "none"; // Hide button after entering AR

            } catch (error) {
                alert("AR Session Failed: " + error);
            }
        } else {
            alert("WebXR not supported.");
        }
    });
</script>

</body>
</html>
