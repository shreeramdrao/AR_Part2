<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR AR Experience</title>
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.module.js";
        import { ARButton } from "https://cdn.jsdelivr.net/npm/three@0.145.0/examples/jsm/webxr/ARButton.js";
        import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.145.0/examples/jsm/loaders/GLTFLoader.js";

        let scene, camera, renderer, model, controller;

        function init() {
            // Create Scene
            scene = new THREE.Scene();

            // Set up Camera
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 20);
            scene.add(camera);

            // WebGL Renderer
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // AR Button
            document.body.appendChild(ARButton.createButton(renderer));

            // Lighting
            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            scene.add(light);

            // Load 3D Model
            const loader = new GLTFLoader();
            loader.load('https://ar-part2.vercel.app/assets/food.glb', function (gltf) {
                model = gltf.scene;
                model.position.set(0, 0, -1); // Place in front
                model.scale.set(0.5, 0.5, 0.5); // Adjust Size
                scene.add(model);
            });

            // AR Controller for Movement
            controller = renderer.xr.getController(0);
            controller.addEventListener('selectstart', moveForward);
            scene.add(controller);

            animate();
        }

        function moveForward() {
            if (model) {
                model.position.z += 0.1; // Moves forward
            }
        }

        function animate() {
            renderer.setAnimationLoop(() => {
                renderer.render(scene, camera);
            });
        }

        init();
    </script>
</body>
</html>
