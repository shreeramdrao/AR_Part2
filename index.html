<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced WebXR AR 3D Model</title>
    
    <!-- Load Three.js and WebXR Modules -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@webxr-polyfill/webxr-polyfill@latest/build/webxr-polyfill.min.js"></script>
    <script type="module">
        import { ARButton } from 'https://cdn.jsdelivr.net/npm/three/examples/jsm/webxr/ARButton.js';
        import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three/examples/jsm/loaders/GLTFLoader.js';

        let scene, camera, renderer, model, controller;

        function init() {
            // Create Scene
            scene = new THREE.Scene();

            // Set up Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
            scene.add(camera);

            // WebGL Renderer
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // AR Button
            document.body.appendChild(ARButton.createButton(renderer));

            // Light
            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            scene.add(light);

            // Load 3D Model
            const loader = new GLTFLoader();
            loader.load('https://ar-part2.vercel.app/assets/food.glb', function (gltf) {
                model = gltf.scene;
                model.position.set(0, 0, -1); // Initial Placement
                model.scale.set(0.5, 0.5, 0.5); // Adjust Size
                scene.add(model);
            });

            // AR Session Handling
            renderer.xr.addEventListener('sessionstart', () => {
                console.log("AR Session Started");
            });

            // Controller for movement
            controller = renderer.xr.getController(0);
            controller.addEventListener('selectstart', () => moveForward());
            scene.add(controller);

            animate();
        }

        function moveForward() {
            if (model) {
                model.position.z += 0.1; // Move forward
            }
        }

        function animate() {
            renderer.setAnimationLoop(() => {
                renderer.render(scene, camera);
            });
        }

        init();
    </script>
</head>
<body></body>
</html>
